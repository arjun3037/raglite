server:
  port: 8080

spring:
  application:
    name: raglite
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/raglite}
    username: ${SPRING_DATASOURCE_USERNAME:raglite}
    password: ${SPRING_DATASOURCE_PASSWORD:raglite}

openai:
  api-key: ${OPENAI_API_KEY:}
  embedding-model: text-embedding-3-small
  chat-model: gpt-4o-mini

raglite:
  chunking:
    chunk-size: 800
    chunk-overlap: 100
  retrieval:
    top-k: 5
  chat:
    max-context-tokens: 4000

logging:
  level:
    com.raglite: INFO
