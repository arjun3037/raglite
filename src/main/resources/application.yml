server:
  port: 8080

spring:
  application:
    name: raglite
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/raglite}
    username: ${SPRING_DATASOURCE_USERNAME:raglite}
    password: ${SPRING_DATASOURCE_PASSWORD:raglite}

gemini:
  api-key: ${GEMINI_API_KEY:}
  embedding-model: gemini-embedding-001
  embedding-dimensions: 1536
  chat-model: gemini-2.5-flash

raglite:
  chunking:
    chunk-size: 800
    chunk-overlap: 100
  retrieval:
    top-k: 5
  chat:
    max-context-tokens: 4000

logging:
  level:
    com.raglite: INFO
